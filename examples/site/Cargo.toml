[package]
name = "site"
# The workspace's version is doxa's, so the site always names the release it documents.
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doxa = { workspace = true, features = ["ui", "npm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Element", "HtmlAnchorElement", "Location", "Window"] }

[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[package.metadata.doxa]
role = "client"
css = ["style/site.css"]

[package.metadata.doxa.npm]
"highlight.js" = "^11"
