[package]
name = "shop-api"
version = "0.0.0"
edition.workspace = true
publish = false

# The shop's routes as declarations, built for the server and for the browser.
[dependencies]
doxa = { workspace = true, features = ["client", "garde"] }
garde = { workspace = true, features = ["derive"] }
serde = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
doxa = { workspace = true, features = ["auth", "policy"] }

[build-dependencies]
doxa-role = { workspace = true }
