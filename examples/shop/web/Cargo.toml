[package]
name = "shop-web"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "shop-web"
path = "src/main.rs"
required-features = ["native"]

[features]
native = ["dep:doxa-native", "dep:tauri"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
doxa-native = { workspace = true, optional = true }
tauri = { version = "2.12", optional = true, features = [] }

[build-dependencies]
doxa-role = { workspace = true, features = ["native-build"] }

[dependencies]
shop-api = { path = "../api" }
doxa = { workspace = true, features = ["ui", "react", "forms", "export", "npm", "tailwind", "native"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "CssStyleDeclaration", "DomRect", "DomTokenList", "Element", "EventTarget", "HtmlElement", "Window"] }

[package.metadata.doxa]
role = "client"
server = "shop-api"
wasm_budget_kb = 700
css = ["style/app.css"]
library = { name = "@shop/kit", scope = ".shop-kit" }

[package.metadata.doxa.native]
identifier = "dev.doxa.shop"
name = "Shop"
schemes = ["doxa-shop"]

[package.metadata.doxa.npm]
react = "^19"
react-dom = "^19"

[dev-dependencies]
doxa = { workspace = true, features = ["ui", "react", "forms", "export", "npm", "tailwind", "client-router"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
