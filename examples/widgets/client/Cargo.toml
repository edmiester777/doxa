[package]
name = "widgets-client"
version = "0.0.0"
edition.workspace = true
publish = false

# The same source as `widgets-api`, compiled as the client half.
[lib]
path = "../api/src/lib.rs"

[dependencies]
doxa = { workspace = true, features = ["client"] }
serde = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
doxa-role = { workspace = true }

[dev-dependencies]
widgets-server = { path = "../server" }
doxa = { workspace = true, features = ["client-router"] }
tokio = { workspace = true }
