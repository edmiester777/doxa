[package]
name = "widgets-web"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
widgets-client = { path = "../client" }
doxa = { workspace = true, features = ["ui", "react", "forms", "export", "npm"] }
futures = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "CssStyleDeclaration", "DomRect", "DomTokenList", "Element", "EventTarget", "HtmlElement", "Window"] }

[package.metadata.doxa]
role = "client"
server = "widgets-server"
wasm_budget_kb = 450
css = ["style/app.css"]
library = { name = "@widgets/kit", scope = ".widgets-kit" }

[package.metadata.doxa.npm]
react = "^19"
react-dom = "^19"

[dev-dependencies]
widgets-server = { path = "../server" }
doxa = { workspace = true, features = ["ui", "react", "forms", "export", "npm", "client-router"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
