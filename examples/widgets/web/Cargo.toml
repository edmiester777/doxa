[package]
name = "widgets-web"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
widgets-client = { path = "../client" }
doxa = { workspace = true, features = ["ui", "react"] }

[package.metadata.doxa]
role = "client"
server = "widgets-server"

[package.metadata.doxa.npm]
react = "^19"
react-dom = "^19"

[dev-dependencies]
widgets-server = { path = "../server" }
doxa = { workspace = true, features = ["ui", "react", "client-router"] }
tokio = { workspace = true }
