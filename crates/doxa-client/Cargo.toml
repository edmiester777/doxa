[package]
name = "doxa-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Call doxa routes from the browser as plain async functions: typed arguments, typed errors, SSE, and a request cache."
keywords = ["doxa", "wasm", "http", "client", "sse"]
categories = ["web-programming::http-client", "wasm"]

[features]
default = []
router = ["dep:axum", "dep:tower", "dep:http", "dep:http-body-util", "dep:bytes"]

[dependencies]
doxa-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
percent-encoding = "2"
futures-core = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestCredentials", "RequestCache", "Headers", "Response", "ReadableStream", "ReadableStreamDefaultReader", "AbortController", "AbortSignal", "Performance"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
