[package]
name = "doxa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The `doxa` command: scaffold, build, and develop a doxa app."
keywords = ["doxa", "cli", "wasm"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "doxa"
path = "src/main.rs"
# Shares the `doxa` lib's doc path.
doc = false

[dependencies]
doxa-build = { workspace = true, features = ["pipeline"] }
doxa-role = { workspace = true }
doxa-fmt = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true }
axum = { workspace = true }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
bytes = { workspace = true }
notify-debouncer-mini = "0.7"
glob = "0.3"
serde_json = { workspace = true }
thiserror = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ansi-to-tui = "8.0.1"
unicode-width = "0.2"
# `doxa tauri`, which `doxa build --desktop|--ios|--android` runs; its output is tagged `[tauri]`.
tauri-cli = "2.12"
toml_edit = "0.23"
sha2 = { workspace = true }
hex = { workspace = true }

# jemalloc doesn't build for MSVC.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "0.9"
tower = { workspace = true, features = ["util"] }
