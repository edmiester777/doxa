[package]
name = "doxa-role"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Build-script helper that marks a crate as the client or server half of a doxa app."
keywords = ["doxa", "build"]
categories = ["development-tools::build-utils"]

[dependencies]
toml = "0.9"
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tauri-build = { version = "2.7", optional = true }
plist = { version = "1.7", optional = true }

[features]
# `[package.metadata.doxa.native]` and the `tauri.conf.json` generated from it.
native = ["dep:serde", "dep:serde_json", "dep:plist"]
# A web crate's `build.rs` building it as a native shell: `tauri-build` runs too.
native-build = ["native", "dep:tauri-build"]
