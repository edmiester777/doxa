[package]
name = "doxa-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Types a doxa server and its browser client agree on: routes, error bodies, keys, and headers."
keywords = ["doxa", "http", "client"]
categories = ["web-programming"]

[features]
default = []
utoipa = ["dep:utoipa"]
# `From<…> for FieldErrors`, for each validation library.
garde = ["dep:garde"]
# garde rules that garde itself gates, implemented for `Nullable<T>` when on.
garde-email = ["garde", "garde/email"]
garde-url = ["garde", "garde/url"]
garde-unicode = ["garde", "garde/unicode"]
garde-credit-card = ["garde", "garde/credit-card"]
garde-phone-number = ["garde", "garde/phone-number"]
validator = ["dep:validator"]
serde_valid = ["dep:serde_valid"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }
garde = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
serde_valid = { workspace = true, optional = true }

[dev-dependencies]
validator = { workspace = true, features = ["derive"] }
serde_valid = { workspace = true }
