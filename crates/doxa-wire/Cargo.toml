[package]
name = "doxa-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Types a doxa server and its browser client agree on: routes, error bodies, keys, and headers."
keywords = ["doxa", "http", "client"]
categories = ["web-programming"]

[features]
default = []
utoipa = ["dep:utoipa"]
# `From<…> for FieldErrors`, for each validation library.
garde = ["dep:garde"]
validator = ["dep:validator"]
serde_valid = ["dep:serde_valid"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }
garde = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
serde_valid = { workspace = true, optional = true }

[dev-dependencies]
validator = { workspace = true, features = ["derive"] }
serde_valid = { workspace = true }
