[package]
name = "doxa-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The native shell of a doxa app, built on Tauri: desktop now, iOS and Android through the same path."
keywords = ["doxa", "tauri", "desktop", "mobile"]
categories = ["gui"]
# Forwards the plugins' `DEP_*` build vars to the app; see `build.rs`.
links = "doxa-native"

[dependencies]
doxa = { workspace = true, features = ["main"] }
doxa-role = { workspace = true, features = ["native"] }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"

[dev-dependencies]
tower = { workspace = true }
