[package]
name = "doxa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Facade crate re-exporting the doxa family: OpenAPI docs, auth, policy, audit, and secret types. Enable only the features you need."
keywords = ["axum", "openapi", "auth", "cedar", "doxa"]
categories = ["web-programming::http-server", "authentication"]

[features]
default = ["docs", "macros", "docs-scalar", "policy-catalog", "auth-catalog"]

# OpenAPI documentation, Scalar UI hosting, and the core doxa-docs
# surface (ApiDocBuilder, MountDocsExt, ProblemDetails, etc.).
docs = ["dep:doxa-docs"]

# Forward Scalar UI feature to doxa-docs.
docs-scalar = ["docs", "doxa-docs/docs-scalar"]

# Re-export doxa-macros proc-macros (#[derive(ApiError)],
# #[derive(SseEvent)], #[get]/#[post]/…) through doxa-docs.
macros = ["docs", "doxa-docs/macros"]

# Zeroize-on-drop secret string type with [REDACTED] display.
protected = ["dep:doxa-protected"]

# SOC 2-flavored append-only audit logging primitives.
audit = ["dep:doxa-audit"]

# SeaORM persistence backend for doxa-audit.
audit-sea-orm = ["audit", "doxa-audit/sea-orm"]

# Provider-agnostic OIDC / JWT auth middleware. Enables axum integration
# and audit support by default.
auth = ["dep:doxa-auth", "doxa-auth/axum", "doxa-auth/audit", "doxa-auth/uuid"]

# Cedar-based authorization policy engine (framework-neutral core).
policy = ["dep:doxa-policy"]

# Policy with axum HTTP surface (POST /check, POST /test).
policy-axum = ["policy", "doxa-policy/axum"]

# Self-registering capability catalog, so `doxa::policy::capabilities()`
# answers without a hand-maintained list. On by default, and a no-op
# unless `policy` is also on. Turn it off for a target that objects to a
# life-before-main constructor per declaration.
policy-catalog = ["doxa-policy?/catalog"]

# Self-registering action catalog, so `doxa::auth::actions()` answers
# without a hand-maintained list. Separate from `policy-catalog` because
# the vocabularies are: a capability is what a client is told it holds,
# an action is what Cedar is asked about, and an instance-only action has
# the second without the first.
auth-catalog = ["doxa-auth?/catalog"]

# SeaORM loaders for policy resources: the `ScopedRow` trait, and the
# `#[resource(key)]` / `#[resource(scope)]` roles on
# `#[derive(PolicyResource)]` that generate an impl of it. Pulls SeaORM
# into the policy layer, so it stays opt-in even under `full`'s siblings.
policy-sea-orm = ["policy", "macros", "doxa-policy/sea-orm", "doxa-docs/macros-sea-orm"]

# Everything.
full = ["docs", "docs-scalar", "macros", "protected", "audit", "audit-sea-orm", "auth", "auth-catalog", "policy-axum", "policy-catalog", "policy-sea-orm"]

[dependencies]
doxa-docs = { workspace = true, optional = true }
doxa-protected = { workspace = true, optional = true }
doxa-audit = { workspace = true, optional = true }
doxa-auth = { workspace = true, optional = true, default-features = false }
doxa-policy = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `mock` so the generated loader can be run and its query inspected
# without a database.
sea-orm = { workspace = true, features = ["mock"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[[example]]
name = "full_test"
required-features = ["full"]

[[test]]
name = "guard_responses"
required-features = ["full"]

[[test]]
name = "denials"
required-features = ["full"]

[[test]]
name = "grants"
required-features = ["full"]

[[test]]
name = "granted"
required-features = ["full"]

[[test]]
name = "granted_routes"
required-features = ["full"]

[[test]]
name = "granted_key_source"
required-features = ["full"]

[[test]]
name = "catalog"
required-features = ["full"]

[[test]]
name = "actions"
required-features = ["full"]

[[test]]
name = "scoped"
required-features = ["full"]

[[test]]
name = "stateful"
required-features = ["full"]

[[test]]
name = "authorize_loaded"
required-features = ["full"]
