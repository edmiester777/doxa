[package]
name = "doxa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Facade crate re-exporting the doxa family: OpenAPI docs, auth, policy, audit, and secret types. Enable only the features you need."
keywords = ["axum", "openapi", "auth", "cedar", "doxa"]
categories = ["web-programming::http-server", "authentication"]

[features]
default = ["docs", "macros", "docs-scalar", "trace", "policy-catalog", "auth-catalog"]

# OpenAPI documentation, Scalar UI hosting, and the core doxa-docs
# surface (ApiDocBuilder, MountDocsExt, ProblemDetails, etc.).
docs = ["dep:doxa-docs", "dep:axum"]

# Forward Scalar UI feature to doxa-docs.
docs-scalar = ["docs", "doxa-docs/docs-scalar"]

# Every mounted route runs under a `route` span: handler, route, tenant, path parameters.
trace = ["docs", "doxa-docs/trace"]

# `doxa::Cors`, for a server a doxa client reaches cross-origin.
cors = ["docs", "doxa-docs/cors"]

# `doxa::proxy`, to serve another server's routes same-origin.
proxy = ["docs", "doxa-docs/proxy"]

# `doxa::Valid<Json<T>>`: garde rules, checked by the server (`422` per failing field) and by
# the client before it sends.
garde = ["dep:garde", "doxa-wire/garde"]
# garde rules garde itself gates, implemented for `Nullable<T>`.
garde-email = ["garde", "doxa-wire/garde-email"]
garde-url = ["garde", "doxa-wire/garde-url"]
garde-unicode = ["garde", "doxa-wire/garde-unicode"]
garde-credit-card = ["garde", "doxa-wire/garde-credit-card"]
garde-phone-number = ["garde", "doxa-wire/garde-phone-number"]
# `doxa::validator::Valid<Json<T>>`, the same for the `validator` crate.
validator = ["dep:validator", "doxa-wire/validator"]
# `doxa::serde_valid::Valid<Json<T>>`, the same for `serde_valid`.
serde-valid = ["dep:serde_valid", "doxa-wire/serde_valid"]

# Re-export doxa-macros proc-macros (#[derive(ApiError)],
# #[derive(SseEvent)], #[get]/#[post]/…) through doxa-docs.
macros = ["docs", "dep:doxa-macros", "doxa-docs/macros"]

# Zeroize-on-drop secret string type with [REDACTED] display.
protected = ["dep:doxa-protected"]

# SOC 2-flavored append-only audit logging primitives.
audit = ["dep:doxa-audit"]

# SeaORM persistence backend for doxa-audit.
audit-sea-orm = ["audit", "doxa-audit/sea-orm"]

# Provider-agnostic OIDC / JWT auth middleware. Enables axum integration
# and audit support by default.
auth = ["dep:doxa-auth", "doxa-auth/axum", "doxa-auth/audit", "doxa-auth/uuid"]

# Cedar-based authorization policy engine (framework-neutral core).
policy = ["dep:doxa-policy"]

# Policy with axum HTTP surface (POST /check, POST /test).
policy-axum = ["policy", "doxa-policy/axum"]

# Self-registering capability catalog, so `doxa::policy::capabilities()`
# answers without a hand-maintained list. On by default, and a no-op
# unless `policy` is also on. Turn it off for a target that objects to a
# life-before-main constructor per declaration.
policy-catalog = ["doxa-policy?/catalog"]

# Self-registering action catalog, so `doxa::auth::actions()` answers
# without a hand-maintained list. Separate from `policy-catalog` because
# the vocabularies are: a capability is what a client is told it holds,
# an action is what Cedar is asked about, and an instance-only action has
# the second without the first.
auth-catalog = ["doxa-auth?/catalog"]

# SeaORM loaders for policy resources: the `ScopedRow` trait, and the
# `#[resource(key)]` / `#[resource(scope)]` roles on
# `#[derive(PolicyResource)]` that generate an impl of it. Pulls SeaORM
# into the policy layer, so it stays opt-in even under `full`'s siblings.
policy-sea-orm = ["policy", "macros", "doxa-policy/sea-orm", "doxa-docs/macros-sea-orm"]

# `doxa::Paged`: `query.page(&db, &input)` answers a SeaORM query as a `doxa::Page`.
sea-orm = ["dep:sea-orm"]

# Compile the built SPA into the binary via `dist!()`; needs `DOXA_DIST`,
# which `doxa build` sets. Not part of `full`.
embed = ["docs", "doxa-docs/embed"]

# `#[doxa::main]`: a server binary whose `start` command binds the port `doxa dev` gives it.
main = ["docs", "dep:doxa-macros", "dep:clap", "dep:tokio", "dep:tracing"]

client =["dep:doxa-client", "dep:doxa-macros"]
# `doxa::client::oidc`: sign-in in the browser with authorization code and PKCE.
oidc = ["client", "doxa-client/oidc", "doxa-ui?/oidc"]
# Drive client calls through an in-process axum `Router`, for native tests.
client-router = ["client", "doxa-client/router"]
ui = ["client", "dep:doxa-ui"]
# `#[react]`: React components inside `view!`.
react = ["ui", "doxa-ui/react"]
# `#[npm]`: plain JS modules bound as typed Rust.
npm = ["ui", "doxa-ui/npm"]
# `form()` and `#[derive(Form)]`: forms checked by a route's rules, with field-level errors.
forms = ["ui", "doxa-ui/forms"]
# `#[component(export)]`: components a foreign React host mounts, from `doxa build --lib`.
export = ["ui", "doxa-ui/export"]
# The `doxa gallery` interface; `doxa gallery` turns it on.
gallery = ["ui", "doxa-ui/gallery"]
# `cn![]`: Tailwind class lists merged so the last conflicting class wins.
tailwind = ["ui", "dep:doxa-tailwind"]

# Everything.
full = ["docs", "docs-scalar", "trace", "macros", "protected", "audit", "audit-sea-orm", "auth", "auth-catalog", "policy-axum", "policy-catalog", "policy-sea-orm", "sea-orm", "client", "ui", "react", "main"]

[dependencies]
doxa-wire = { workspace = true }
doxa-macros = { workspace = true, optional = true }
doxa-client = { workspace = true, optional = true }
doxa-ui = { workspace = true, optional = true }
doxa-tailwind = { workspace = true, optional = true }
doxa-protected = { workspace = true, optional = true }
serde = { workspace = true }
garde = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
serde_valid = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
doxa-docs = { workspace = true, optional = true }
doxa-audit = { workspace = true, optional = true }
doxa-auth = { workspace = true, optional = true, default-features = false }
doxa-policy = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
futures = { workspace = true }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `mock` so the generated loader can be run and its query inspected
# without a database.
sea-orm = { workspace = true, features = ["mock"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
garde = { workspace = true, features = ["derive"] }
validator = { workspace = true, features = ["derive"] }
serde_valid = { workspace = true }
sha2 = { workspace = true }
serde_urlencoded = "0.7"
http-body-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

