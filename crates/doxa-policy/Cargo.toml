[package]
name = "doxa-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Framework-neutral Cedar-based authorization policy engine. Policy / PolicyExtension / PolicyStore / PolicyRouter traits with a generic Cedar implementation."
keywords = ["authorization", "policy", "cedar", "rbac", "axum"]
categories = ["authentication", "web-programming"]

[features]
default = ["catalog"]
# Optional axum integration: derives `ApiError` for `AuthError` so the
# error type plugs straight into axum handlers with typed OpenAPI docs.
axum = ["dep:axum", "dep:doxa", "dep:doxa-macros", "dep:http", "dep:utoipa"]
# Self-assembling capability catalog. Every `#[capability]` registers
# itself, so `capabilities()` answers without a hand-maintained list.
# Costs a life-before-main constructor per declaration; turn it off on a
# target that objects and enumerate the catalog yourself.
catalog = ["dep:inventory"]
# SeaORM loaders for rows a route resolves before authorizing them.
# Enables `ScopedRow`, whose default method bodies turn two column
# constants into a scoped lookup and a scoped `Select`.
sea-orm = ["dep:sea-orm"]

[dependencies]
cedar-policy = { workspace = true }
cached = { workspace = true }
inventory = { workspace = true, optional = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true, optional = true }
doxa = { package = "doxa-docs", path = "../doxa-docs", version = "0.1.6", optional = true }
doxa-macros = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
http = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
