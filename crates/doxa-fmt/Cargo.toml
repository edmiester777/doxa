[package]
name = "doxa-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Formatter for the bodies of doxa `view!` macro invocations, complementing rustfmt."
keywords = ["formatter", "rustfmt", "view", "jsx", "doxa"]
categories = ["development-tools"]

[dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { version = "3", features = ["full", "extra-traits", "visit", "printing", "parsing"] }
quote = { workspace = true }
rstml = { version = "0.13", default-features = false }
prettyplease = "0.3"
similar = "2"
