name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --workspace --all-features --verbose
    - name: Format view! bodies
      run: cargo run -q -p doxa-fmt -- --check crates examples

  wasm:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Check the client half for the browser
      run: cargo check -p doxa-client -p doxa-ui -p widgets-client -p widgets-web --target wasm32-unknown-unknown

  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install 1.85
      run: rustup toolchain install 1.85 --profile minimal
    - name: Check on the minimum supported Rust
      run: cargo +1.85 check --workspace --all-features
