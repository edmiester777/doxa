name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --workspace --all-features --verbose
    - name: Format view! bodies
      run: cargo run -q -p doxa-fmt -- --check crates examples

  wasm:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Check the client half for the browser
      run: |
        cargo check -p doxa-client -p doxa-ui -p shop-api -p shop-web -p site --lib --target wasm32-unknown-unknown
        cargo check -p doxa --features react --target wasm32-unknown-unknown

  browser:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Install the test runner the resolved wasm-bindgen needs
      run: |
        version=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
        cargo install wasm-bindgen-cli --version "$version" --locked
    - name: Run the renderer in headless Chrome
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        CHROMEDRIVER: ${{ env.CHROMEWEBDRIVER }}/chromedriver
      run: cargo test -p doxa-ui --target wasm32-unknown-unknown --test browser

  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add the wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Install wasm-opt
      run: sudo apt-get install -y binaryen
    - name: Build the example optimized, inside its wasm budget
      run: cargo run -q -p doxa-cli -- build --release -p shop-web

  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install 1.88
      run: rustup toolchain install 1.88 --profile minimal
    - name: Check on the minimum supported Rust
      run: cargo +1.88 check --workspace --all-features
